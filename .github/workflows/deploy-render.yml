name: Deploy to Render

on:
  push:
    branches: [main]

# One production deploy at a time; let an in-flight deploy finish before the next.
concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      APP_URL: ${{ secrets.RENDER_APP_URL }}
      API: https://api.render.com/v1
    steps:
      - name: Trigger Render deploy
        id: deploy
        run: |
          id=$(curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}' \
            "$API/services/$SERVICE_ID/deploys" | jq -r '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Triggered deploy $id"

      - name: Wait for deploy to reach live
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "$API/services/$SERVICE_ID/deploys/${{ steps.deploy.outputs.id }}" | jq -r '.status')
            echo "deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) echo "Deploy did not succeed" && exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deploy to go live" && exit 1

      - name: Smoke test the live URL
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-connrefused \
            "$APP_URL/api/health" | grep -q '"status":"ok"'
