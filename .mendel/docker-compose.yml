# Demo stack for the guided-learning-wizard variation.
#
# The wizard itself is entirely client-side (state lives in localStorage), so no
# schema changes are needed. Postgres is still required because the app's
# startup command runs `prisma migrate deploy` before serving.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '3000' # Let Docker assign the host port.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      # Auth.js needs a secret to sign session cookies and — because the demo
      # runs off-Vercel behind Docker's assigned host — an explicit trust-host
      # flag. This is a throwaway demo secret, not a production credential. No
      # GOOGLE_/AZURE_AD_ OAuth credentials are supplied, so the /login page
      # renders the SSO UI but real sign-in requires a school's own OAuth apps
      # (see SCHOOL_SSO_SETUP.md).
      AUTH_SECRET: demo-only-not-a-real-secret-change-me
      AUTH_TRUST_HOST: 'true'
    healthcheck:
      # node:20-alpine ships busybox wget; --spider makes a HEAD-style probe.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 2s
      timeout: 5s
      retries: 15
